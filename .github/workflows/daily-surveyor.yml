name: Daily MTG surveyor

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote eligible WPN observations into canonical Events"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_refresh:
        description: "Refresh WPN even when the cache is still fresh"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      social:
        description: "Also run Instagram/Facebook surface survey lanes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      social_limit:
        description: "Maximum sources per social platform"
        required: true
        default: "3"
      social_include_suppressed:
        description: "Explicit proof run: allow social surfaces that are not due yet"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "37 13 * * *"

permissions:
  contents: read

concurrency:
  group: daily-mtg-surveyor
  cancel-in-progress: false

jobs:
  survey:
    name: WPN cache and promoter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOCIAL_INSTAGRAM_STORAGE_STATE_JSON: ${{ secrets.SOCIAL_INSTAGRAM_STORAGE_STATE_JSON }}
      SOCIAL_FACEBOOK_STORAGE_STATE_JSON: ${{ secrets.SOCIAL_FACEBOOK_STORAGE_STATE_JSON }}
      SOCIAL_HEADLESS: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"

    steps:
      - name: Check required secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_URL."
            echo "Add the Supabase Session pooler Postgres URI as a repository Actions secret."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: "2.109.1"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up Node for social probes
        if: ${{ github.event_name == 'schedule' || inputs.social == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Playwright for social probes
        if: ${{ github.event_name == 'schedule' || inputs.social == 'true' }}
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install chromium

      - name: Run daily surveyor
        shell: bash
        run: |
          args=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.promote }}" = "true" ]; then
            args+=(--promote)
          fi
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            args+=(--force-refresh)
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.social }}" = "true" ]; then
            args+=(--social-platform instagram --social-platform facebook --social-limit "${{ inputs.social_limit || '3' }}")
          fi
          if [ "${{ inputs.social_include_suppressed }}" = "true" ]; then
            args+=(--social-include-suppressed)
          fi
          python scripts/daily_surveyor.py "${args[@]}"
