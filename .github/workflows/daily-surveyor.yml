name: Daily MTG surveyor

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote eligible WPN observations into canonical Events"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_refresh:
        description: "Refresh WPN even when the cache is still fresh"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "37 13 * * *"

permissions:
  contents: read

concurrency:
  group: daily-mtg-surveyor
  cancel-in-progress: false

jobs:
  survey:
    name: WPN cache and promoter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"

    steps:
      - name: Check required secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_URL."
            echo "Add the Supabase Session pooler Postgres URI as a repository Actions secret."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: "2.109.1"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily surveyor
        shell: bash
        run: |
          args=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.promote }}" = "true" ]; then
            args+=(--promote)
          fi
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            args+=(--force-refresh)
          fi
          python scripts/daily_surveyor.py "${args[@]}"
