name: Daily Discord survey

on:
  workflow_dispatch:
    inputs:
      write_watchlist:
        description: "Update discord_channel_watchlist rows"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      limit:
        description: "Optional row limit for smoke tests; leave blank for full v1"
        required: false
        default: ""
      surface:
        description: "Optional surface filter such as mtg-oc, lcc, or collectors"
        required: false
        default: ""
  schedule:
    # 06:15 PT during standard time, 07:15 PT during daylight time.
    - cron: "15 14 * * *"

permissions:
  contents: read

concurrency:
  group: daily-discord-survey
  cancel-in-progress: false

jobs:
  discord-survey:
    name: Discord guarded surface survey
    # Keep the OS compatible with pinned Playwright 1.54.2; upgrade together.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      SOCIAL_HEADLESS: "1"

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_URL."
            echo "Add the Supabase Session pooler Postgres URI as a repository Actions secret."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate Discord write lifecycle
        run: |
          node scripts/test_discord_surface_write_isolation.mjs
          python scripts/test_refresh_daily_agent_status.py
          python scripts/test_recurring_surface_monitoring.py

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install chromium
          echo "CODEX_NODE_MODULES=${GITHUB_WORKSPACE}/node_modules" >> "$GITHUB_ENV"
          node -e "const { chromium } = require('playwright'); console.log('DISCORD_PROOF_BROWSER=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Hydrate Discord read-only storage state
        shell: bash
        env:
          DISCORD_READONLY_STORAGE_STATE_GZIP: ${{ secrets.DISCORD_READONLY_STORAGE_STATE_GZIP }}
          DISCORD_READONLY_STORAGE_STATE_JSON: ${{ secrets.DISCORD_READONLY_STORAGE_STATE_JSON }}
          DISCORD_READONLY_STORAGE_STATE_PASSPHRASE: ${{ secrets.DISCORD_READONLY_STORAGE_STATE_PASSPHRASE }}
        run: |
          set -o pipefail
          umask 077
          mkdir -p work/discord-readonly/profile
          if [ -n "$DISCORD_READONLY_STORAGE_STATE_GZIP" ]; then
            printf '%s' "$DISCORD_READONLY_STORAGE_STATE_GZIP" | base64 --decode | gzip --decompress > work/discord-readonly/storage-state.json
          elif [ -n "$DISCORD_READONLY_STORAGE_STATE_JSON" ]; then
            printf '%s\n' "$DISCORD_READONLY_STORAGE_STATE_JSON" > work/discord-readonly/storage-state.json
          else
            if [ ! -f ".github/secrets/discord-readonly-storage-state.json.enc" ]; then
              echo "::error::Missing encrypted Discord storage-state file .github/secrets/discord-readonly-storage-state.json.enc."
              exit 1
            fi
            node scripts/crypt_secret_file.mjs decrypt \
              --input .github/secrets/discord-readonly-storage-state.json.enc \
              --output work/discord-readonly/storage-state.json \
              --passphrase-env DISCORD_READONLY_STORAGE_STATE_PASSPHRASE
          fi

      - name: Run Discord daily survey
        id: discord_survey
        shell: bash
        env:
          SURVEY_WRITE_WATCHLIST: ${{ inputs.write_watchlist }}
          SURVEY_LIMIT: ${{ inputs.limit }}
          SURVEY_SURFACE: ${{ inputs.surface }}
        run: |
          args=(--no-signal-writes)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$SURVEY_WRITE_WATCHLIST" = "true" ]; then
            args+=(--write-watchlist)
          else
            args+=(--dry-run)
          fi
          if [ -n "$SURVEY_LIMIT" ]; then
            args+=(--limit "$SURVEY_LIMIT")
          fi
          if [ -n "$SURVEY_SURFACE" ]; then
            args+=(--surface "$SURVEY_SURFACE")
          fi
          set +e
          node scripts/run_discord_daily_survey.mjs "${args[@]}"
          survey_exit_code=$?
          set -e
          echo "exit_code=${survey_exit_code}" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            import fs from "node:fs";
            const dir = "work/discord-daily-survey/logs";
            const log = fs.existsSync(dir) && fs.readdirSync(dir).filter(name => name.endsWith(".json")).sort().at(-1);
            if (log) {
              const { results } = JSON.parse(fs.readFileSync(`${dir}/${log}`, "utf8"));
              for (const { rowId, routeState, outcome, failureStage, externalDiscordStateChanged } of results) {
                console.log(JSON.stringify({ rowId, routeState, outcome, failureStage, externalDiscordStateChanged }));
              }
            }'

      - name: Refresh app daily-agent status
        if: github.event_name == 'schedule' || (inputs.write_watchlist == 'true' && inputs.surface == '' && inputs.limit == '')
        shell: bash
        run: >-
          python scripts/refresh_daily_agent_status.py
          --ran-agent discord
          --discord-run-summary work/discord-daily-survey/latest-run-summary.json

      - name: Upload Discord survey logs
        if: always() && (github.event_name == 'schedule' || inputs.write_watchlist == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: discord-daily-survey-logs
          path: |
            work/discord-daily-survey/latest-run-summary.json
            work/discord-daily-survey/logs/*.json
            work/discord-readonly/logs/*.json
          if-no-files-found: warn

      - name: Upload read-only check summary
        if: always() && github.event_name == 'workflow_dispatch' && inputs.write_watchlist == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: discord-daily-survey-summary
          path: work/discord-daily-survey/latest-run-summary.json
          if-no-files-found: warn

      - name: Propagate hard survey failure
        if: always() && steps.discord_survey.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::Discord survey failed. See the survey diagnostics."
          exit 1
