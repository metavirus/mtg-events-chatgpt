name: Deploy Mana Radar to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/reconcile-wizards
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          cp app.js _site/
          cp styles.css _site/
          cp manifest.webmanifest _site/
          cp -r assets _site/
          cp stores.json _site/
          cp events.json _site/
          cp sources.json _site/
          cp changes.json _site/
          cp .nojekyll _site/
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
