name: Text integrity

on:
  push:
    branches:
      - main
      - codex/reconcile-wizards
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-text:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate text integrity
        run: python scripts/validate_text_integrity.py --full-repo
