name: Refresh Wizards locator data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Query Wizards public event feed
        run: |
          python crawler/wizards_locator.py \
            --radius-miles 26 \
            --output output/wizards

      - name: Commit changed data
        run: |
          if git diff --quiet -- output/wizards; then
            echo "No locator changes."
            exit 0
          fi

          git config user.name "commander-research-bot"
          git config user.email "commander-research-bot@users.noreply.github.com"
          git add output/wizards
          git commit -m "Refresh Wizards locator data"
          git push
